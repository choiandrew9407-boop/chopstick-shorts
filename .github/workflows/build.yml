name: Build shorts

on:
  push:
    paths: ["episodes/**", "tools/**", "assets/**"]
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episode folders to build, space-separated (blank = all)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install Piper TTS and voice (LJSpeech, public-domain dataset)
        run: |
          pip install -q pillow piper-tts==1.2.0
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/medium
          curl -sSL -o voices/en.onnx      $base/en_US-ljspeech-medium.onnx
          curl -sSL -o voices/en.onnx.json $base/en_US-ljspeech-medium.onnx.json
          echo "PIPER_MODEL=$PWD/voices/en.onnx" >> $GITHUB_ENV

      - name: Pick episodes to build
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episodes }}" ]; then
            list="${{ github.event.inputs.episodes }}"
          else
            list=$(git diff --name-only HEAD~1 HEAD -- episodes | cut -d/ -f1-2 | sort -u | tr '\n' ' ')
            [ -z "$list" ] && list=$(ls -d episodes/*/ | sed 's#/$##' | tr '\n' ' ')
          fi
          echo "list=$list" >> $GITHUB_OUTPUT
          echo "Building: $list"

      - name: Build
        run: python tools/build.py ${{ steps.pick.outputs.list }}

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 30
